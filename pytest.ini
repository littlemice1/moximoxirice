[pytest]
# 测试目录：仓库根目录直接 `pytest` 即可
testpaths = tests

# 固化报告输出：
#   -ra                  汇总显示失败/跳过/xfail 用例
#   覆盖率               语句+分支，HTML 报告输出到 docs/reports/coverage
#   pytest-html 报告     单文件自包含，输出到 docs/reports/pytest_report.html
addopts =
    -ra
    --cov=mice
    --cov-branch
    --cov-report=term-missing:skip-covered
    --cov-report=html:docs/reports/coverage
    --html=docs/reports/pytest_report.html
    --self-contained-html
